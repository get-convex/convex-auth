name: Rust

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/argon2id-wasm/src/argon2-wasm/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/rust-setup/**"
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/argon2id-wasm/src/argon2-wasm

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup

      - name: cargo fmt
        run: just fmt

      - name: cargo clippy
        run: just lint

      - name: cargo test
        run: just test

      - name: Compile for wasm32 target
        run: just check
