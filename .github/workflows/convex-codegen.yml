name: Convex codegen

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [reboot]
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/convex-codegen.yml"
      - "examples/**"
      - "packages/**"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check generated code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Convex code
        run: |
          set -euo pipefail

          apps=(
            examples/react-minimal
            examples/react-google
            examples/react-github
            examples/react-password
            examples/react-password-requirements
            examples/react-passkey
            examples/nextjs
          )

          # Create an anonymous local deployment for each app. This gives the
          # codegen command a deployment to analyze without requiring CI
          # credentials or modifying a cloud deployment.
          for app in "${apps[@]}"; do
            deployment="anonymous:anonymous-codegen-${app##*/}"
            (
              cd "$app"
              CONVEX_DEPLOYMENT="$deployment" \
                pnpm exec convex dev --once --skip-push --codegen disable --typecheck disable
              pnpm exec convex codegen --typecheck disable
            )
          done

          components=(
            packages/core/src/components/anonymous
            packages/core/src/components/core
            packages/core/src/components/email
            packages/core/src/components/passkey
            packages/core/src/components/password
            packages/core/src/components/username
            packages/core/src/oauth/component
          )

          # Component codegen uses the app deployment selected above, while
          # --component-dir directs the generated files into the component.
          for component in "${components[@]}"; do
            (
              cd examples/nextjs
              pnpm exec convex codegen \
                --component-dir "../../$component" \
                --typecheck disable
            )
          done

      - name: Verify generated code is committed
        run: |
          if ! git diff --quiet; then
            echo "Generated Convex code is out of date. Run the Convex codegen commands and commit the result."
            git diff --stat
            git diff
            exit 1
          fi
