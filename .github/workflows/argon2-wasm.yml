name: argon2-wasm CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "src/components/passwordProvider/argon2-wasm/**"

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/components/passwordProvider/argon2-wasm

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      # Reads rust-toolchain.toml and installs the pinned toolchain + targets.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/components/passwordProvider/argon2-wasm/target
          key: ${{ runner.os }}-cargo-argon2-wasm-${{ hashFiles('src/components/passwordProvider/argon2-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-argon2-wasm-

      - name: cargo fmt
        run: just fmt

      - name: cargo clippy
        run: just lint

      - name: cargo test
        run: just test

      - name: Compile for wasm32 target
        run: just check
